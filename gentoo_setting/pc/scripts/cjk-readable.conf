<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 明确简体中文回退；缺少商业字体时不用楷体代替界面字体。 -->
  <alias><family>HarmonyOS Sans</family><prefer><family>HarmonyOS Sans SC</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>HarmonyOS Sans SC</family><default><family>Noto Sans CJK SC</family></default></alias>
  <alias><family>sans-serif</family><prefer><family>HarmonyOS Sans SC</family><family>Noto Sans CJK SC</family><family>Noto Sans</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>HarmonyOS Sans SC</family><family>Noto Sans CJK SC</family><family>Noto Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>IntoneMono Nerd Font Mono</family><family>Noto Sans Mono</family><family>HarmonyOS Sans SC</family><family>Noto Sans CJK SC</family></prefer></alias>
</fontconfig>
