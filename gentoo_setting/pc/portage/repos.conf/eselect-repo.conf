# managed by eselect-repository

[gentoo-zh]
auto-sync = yes
location = /var/db/repos/gentoo-zh
sync-type = git
# Domestic mirror verified for smart HTTP and shallow sync.
sync-uri = https://mirror.nju.edu.cn/git/gentoo-zh.git
# Temporary official override is available in upgrade-sonicde.sh.

[guru]
auto-sync = yes
location = /var/db/repos/guru
sync-type = git
sync-uri = https://github.com/gentoo-mirror/guru.git

[sonicde]
auto-sync = yes
location = /var/db/repos/sonicde
sync-type = git
sync-uri = https://github.com/sonicde-gentoo/portage

[xlibre]
auto-sync = yes
location = /var/db/repos/xlibre
priority = 100
sync-type = git
sync-uri = https://github.com/X11Libre/ports-gentoo
