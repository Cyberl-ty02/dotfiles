# Gentoo PC make.conf
# Target: amd64 OpenRC, Clang/LLVM, SonicDE on XLibre, NVIDIA and Secure Boot.

# Clang ThinLTO is currently disabled for host-wide build stability.
#CLANG_LTO_FLAGS="-flto=thin"
COMMON_FLAGS="-march=native -O2 -pipe"
FORTRAN_LTO_FLAGS="-flto"
CFLAGS="${COMMON_FLAGS} ${CLANG_LTO_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${CLANG_LTO_FLAGS}"
# GCC Fortran does not support Clang's -flto=thin spelling.
FCFLAGS="${COMMON_FLAGS} ${FORTRAN_LTO_FLAGS}"
FFLAGS="${COMMON_FLAGS} ${FORTRAN_LTO_FLAGS}"
LC_MESSAGES=C.utf8

# The Gentoo LLVM profile selects Clang, LLVM binutils, libc++, compiler-rt,
# llvm-libunwind and lld. Keep mold opt-in; swap the two lines when ready.
#LDFLAGS="-Wl,-O1 -Wl,--as-needed -Wl,-z,pack-relative-relocs"
LDFLAGS="-fuse-ld=mold -Wl,-O1 -Wl,--as-needed -Wl,-z,pack-relative-relocs"

AUDIO_USE="pipewire pulseaudio"
COMPILER_USE="compress-zstd openmp zstd"
DESKTOP_USE="desktop-portal display-manager sddm"
DEVICE_USE="bluetooth networkmanager smart thunderbolt"
GRAPHICS_USE="egl opengl vulkan wayland X"
MEDIA_USE="fontconfig harfbuzz icu jpeg png svg truetype webp"
QT_USE="postgres qml qt6 widgets -mysql"
SECURE_USE="modules-sign secureboot verify-sig"
SESSION_USE="dbus elogind policykit udev -systemd"
SYSTEM_USE="btrfs"
USE="${AUDIO_USE} ${COMPILER_USE} ${DESKTOP_USE} ${DEVICE_USE} ${GRAPHICS_USE} ${MEDIA_USE} ${QT_USE} ${SECURE_USE} ${SESSION_USE} ${SYSTEM_USE}"

ABI_X86="32 64"

MODULES_SIGN_CERT="/etc/kernel/secureboot/MOK.pem"
MODULES_SIGN_KEY="/etc/kernel/secureboot/MOK.pem"
SECUREBOOT_SIGN_CERT="/etc/kernel/secureboot/MOK.pem"
SECUREBOOT_SIGN_KEY="/etc/kernel/secureboot/MOK.pem"

EMERGE_DEFAULT_OPTS="--autounmask --autounmask-keep-masks --autounmask-write=n --keep-going --jobs=2 --load-average=13"
FEATURES="binpkg-multi-instance buildpkg candy parallel-fetch preserve-libs userfetch userpriv usersandbox"
MAKEOPTS="-j13 -l13"
PORTAGE_NICENESS=15

INPUT_DEVICES="libinput"
L10N="en-US zh-CN"
LINGUAS="en_US zh_CN"
LLVM_TARGETS="NVPTX WebAssembly X86"
QEMU_SOFTMMU_TARGETS="aarch64 x86_64"
QEMU_USER_TARGETS="aarch64 x86_64"
VIDEO_CARDS="intel modesetting nvidia"

# Default Gentoo distfiles mirror.
FETCHCOMMAND="/usr/bin/curl --retry 3 --connect-timeout 60 -Lfo \"\${DISTDIR}/\${FILE}\" \"\${URI}\""
GENTOO_MIRRORS="https://distfiles.gentoo.org"
# Mainland China alternative (disable the line above before enabling this one).
#GENTOO_MIRRORS="https://mirrors.tuna.tsinghua.edu.cn/gentoo https://mirrors.ustc.edu.cn/gentoo"
RESUMECOMMAND="/usr/bin/curl -C - --retry 3 --connect-timeout 60 -Lfo \"\${DISTDIR}/\${FILE}\" \"\${URI}\""

# Optional proxy.
#https_proxy="http://127.0.0.1:7890"
#http_proxy="http://127.0.0.1:7890"
#all_proxy="socks5h://127.0.0.1:7890"
