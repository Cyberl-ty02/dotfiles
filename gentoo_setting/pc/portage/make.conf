# Gentoo musl/LLVM 桌面配置
# 适用本轮 musl stage3：OpenRC、SonicDE/XLibre、独立 NVIDIA 用户态及 Secure Boot。

# 编译选项：C/C++ ThinLTO 依赖同版本 LLVMgold，已知例外见实验 README。
# -march=native 与并行数针对本机；换机器安装时按目标硬件调整。
CLANG_LTO_FLAGS="-flto=thin"
CLANG_LTO_LINK_FLAGS="-Wl,--plugin-opt=jobs=2"
CARGO_PROFILE_RELEASE_LTO="thin"
COMMON_FLAGS="-march=native -O2 -pipe"
FORTRAN_LTO_FLAGS="-flto"
CFLAGS="${COMMON_FLAGS} ${CLANG_LTO_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${CLANG_LTO_FLAGS}"
# Fortran 保留标准 -flto 写法；这不会安装 GCC 或启用 Clang 的 ThinLTO 选项。
FCFLAGS="${COMMON_FLAGS} ${FORTRAN_LTO_FLAGS}"
FFLAGS="${COMMON_FLAGS} ${FORTRAN_LTO_FLAGS}"
CHOST="x86_64-pc-linux-musl"
# 关键词策略继承所选 profile；测试版仅在 package.accept_keywords 中按包启用。
LC_MESSAGES=C.UTF-8

# 链接器全局默认 mold；内核／UEFI 的 LLD／BFD 例外由 package.env/desktop 管理。
DEFAULT_LINKER="mold"
LD="ld.${DEFAULT_LINKER}"
LDFLAGS="-fuse-ld=${DEFAULT_LINKER} ${CLANG_LTO_FLAGS} ${CLANG_LTO_LINK_FLAGS} -Wl,-O1 -Wl,--as-needed -Wl,-z,pack-relative-relocs"

# USE 按功能分组：PipeWire 为服务端，ALSA 提供底层音频支持。
AUDIO_USE="alsa pipewire pulseaudio"
COMPILER_USE="compress-zstd openmp zstd -cuda"
DESKTOP_USE="desktop-portal display-manager"
DEVICE_USE="bluetooth networkmanager smart thunderbolt"
GRAPHICS_USE="egl opengl vulkan wayland X"
MEDIA_USE="fontconfig harfbuzz icu jpeg png svg truetype webp"
QT_USE="postgres qml qt6 widgets -mysql"
SECURE_USE="modules-sign secureboot verify-sig"
SESSION_USE="dbus elogind policykit udev -systemd"
SYSTEM_USE="btrfs"
USE="${AUDIO_USE} ${COMPILER_USE} ${DESKTOP_USE} ${DEVICE_USE} ${GRAPHICS_USE} ${MEDIA_USE} ${QT_USE} ${SECURE_USE} ${SESSION_USE} ${SYSTEM_USE}"

# 本轮原生 musl stage3 仅使用 64 位 ABI；glibc 应用使用独立运行时。
ABI_X86="64"

# 签名材料仅填写目标路径；新机需另行准备自己的密钥，配置仓库不保存私钥。
MODULES_SIGN_CERT="/etc/kernel/secureboot/MOK.pem"
MODULES_SIGN_KEY="/etc/kernel/secureboot/MOK.pem"
SECUREBOOT_SIGN_CERT="/etc/kernel/secureboot/MOK.pem"
SECUREBOOT_SIGN_KEY="/etc/kernel/secureboot/MOK.pem"

# 构建调度：保留 profile 的 FEATURES、普通用户编译及沙箱，按内存和磁盘调整并行数。
EMERGE_DEFAULT_OPTS="--autounmask --autounmask-keep-masks --autounmask-write=n --keep-going --jobs=2 --load-average=13"
FEATURES="${FEATURES} binpkg-multi-instance buildpkg candy parallel-fetch preserve-libs userfetch userpriv usersandbox"
MAKEOPTS="-j13 -l13"
PORTAGE_NICENESS=15

# 输入、中文优先及目标语言／架构；Python 与当前已验收的软件栈保持一致。
INPUT_DEVICES="libinput"
L10N="zh-CN en-US"
LINGUAS="zh_CN en_US"
LLVM_TARGETS="NVPTX WebAssembly X86"
QEMU_SOFTMMU_TARGETS="aarch64 x86_64"
QEMU_USER_TARGETS="aarch64 x86_64"
# NVIDIA 模块及独立用户态按包选择，完整显示验收前不启用全局 nvidia。
VIDEO_CARDS="intel modesetting"
PYTHON_TARGETS="python3_14"
PYTHON_SINGLE_TARGET="python3_14"

# 下载与二进制包目录继承 Portage 默认值，此处不固定缓存目录，也不启用 ccache。
# 优先国内镜像，官方 CDN 作为最后回退；下载与断点续传均限制重试次数。
FETCHCOMMAND="/usr/bin/curl --retry 3 --connect-timeout 60 -Lfo \"\${DISTDIR}/\${FILE}\" \"\${URI}\""
GENTOO_MIRRORS="https://mirrors.ustc.edu.cn/gentoo https://repo.huaweicloud.com/gentoo https://mirrors.aliyun.com/gentoo https://mirrors.tuna.tsinghua.edu.cn/gentoo https://distfiles.gentoo.org"
RESUMECOMMAND="/usr/bin/curl -C - --retry 3 --connect-timeout 60 -Lfo \"\${DISTDIR}/\${FILE}\" \"\${URI}\""

# 可选代理：需要时使用调用环境或临时设置，不在此保存凭据。
