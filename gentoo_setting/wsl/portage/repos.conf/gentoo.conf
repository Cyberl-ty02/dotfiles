[DEFAULT]
main-repo = gentoo

[gentoo]
auto-sync = yes
location = /var/db/repos/gentoo
sync-openpgp-key-package = sec-keys/openpgp-keys-gentoo-release
sync-openpgp-key-path = /usr/share/openpgp-keys/gentoo-release.asc
sync-openpgp-key-refresh = no
sync-git-verify-commit-signature = yes
sync-git-verify-max-age-days = 3
sync-type = git
sync-uri = https://mirrors.ustc.edu.cn/gentoo.git

# CERNET fallback: enable both lines because some participating mirrors only
# provide dumb HTTP and require a full-history clone.
#sync-depth = 0
#sync-uri = https://mirrors.cernet.edu.cn/gentoo-portage.git
# Direct domestic shallow-clone fallback:
#sync-uri = https://mirrors.tuna.tsinghua.edu.cn/git/gentoo-portage.git
# Official Git fallback:
#sync-uri = https://github.com/gentoo-mirror/gentoo.git
