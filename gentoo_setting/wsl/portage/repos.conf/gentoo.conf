[DEFAULT]
main-repo = gentoo

[gentoo]
auto-sync = yes
location = /var/db/repos/gentoo
sync-type = git
sync-uri = https://mirrors.tuna.tsinghua.edu.cn/git/gentoo-portage.git

# CERNET joint mirror is preferred when its selected backend supports Git
# smart HTTP shallow clone; the current HUST redirect does not.
#sync-uri = https://mirrors.cernet.edu.cn/gentoo-portage.git

# Rsync bootstrap/recovery only: disable the Git pair above, then enable the
# pair below and its OpenPGP MetaManifest verification settings.
#sync-openpgp-key-package = sec-keys/openpgp-keys-gentoo-release
#sync-openpgp-key-path = /usr/share/openpgp-keys/gentoo-release.asc
#sync-rsync-verify-jobs = 1
#sync-rsync-verify-max-age = 3
#sync-rsync-verify-metamanifest = yes
#sync-type = rsync
#sync-uri = rsync://mirror.nju.edu.cn/gentoo-portage
# Official rsync fallback (use instead of the NJU rsync URI):
#sync-uri = rsync://rsync.gentoo.org/gentoo-portage
