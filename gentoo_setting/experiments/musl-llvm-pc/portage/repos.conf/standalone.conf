[DEFAULT]
main-repo = gentoo

[gentoo]
location = /var/db/repos/gentoo
sync-type = git
sync-uri = https://mirrors.ustc.edu.cn/gentoo.git
# Keep the verified migration baseline until boot acceptance.
auto-sync = no
sync-openpgp-key-package = sec-keys/openpgp-keys-gentoo-release
sync-openpgp-key-path = /usr/share/openpgp-keys/gentoo-release.asc
sync-git-verify-commit-signature = yes
sync-git-verify-max-age-days = 3

[sonicde]
location = /var/db/repos/sonicde
sync-type = git
sync-uri = https://github.com/sonicde-gentoo/portage
# Keep the verified migration baseline until boot acceptance.
auto-sync = no

[xlibre]
location = /var/db/repos/xlibre
sync-type = git
sync-uri = https://github.com/X11Libre/ports-gentoo
# Keep the verified migration baseline until boot acceptance.
auto-sync = no
priority = 100

[guru]
location = /var/db/repos/guru
sync-type = git
sync-uri = https://github.com/gentoo-mirror/guru.git
# Keep the verified migration baseline until boot acceptance.
auto-sync = no

[gentoo-zh]
location = /var/db/repos/gentoo-zh
sync-type = git
sync-uri = https://mirror.nju.edu.cn/git/gentoo-zh.git
# Keep the verified migration baseline until boot acceptance.
auto-sync = no
