# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# WARNING: Changing your CHOST is not something that should be done lightly.
# Please consult https://wiki.gentoo.org/wiki/Changing_the_CHOST_variable before changing.
CHOST="x86_64-pc-linux-musl"

# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.UTF-8

# Fresh-stage reproducibility probe; no sandbox overrides.
MAKEOPTS="-j2 -l8"
GENTOO_MIRRORS="https://mirrors.ustc.edu.cn/gentoo https://distfiles.gentoo.org"

# Native desktop target; normal profile FEATURES/users retained.
ACCEPT_KEYWORDS="amd64"
USE="X wayland elogind -systemd dbus policykit qml widgets opengl egl vulkan icu networkmanager bluetooth pipewire pulseaudio -cuda harfbuzz fontconfig truetype png jpeg svg"
VIDEO_CARDS="intel modesetting"
INPUT_DEVICES="libinput"
L10N="zh-CN en-US"
LINGUAS="zh_CN en_US"
LLVM_TARGETS="X86 NVPTX WebAssembly"
PYTHON_TARGETS="python3_14"
PYTHON_SINGLE_TARGET="python3_14"
PKGDIR="/var/cache/binpkgs"
